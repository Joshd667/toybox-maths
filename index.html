<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Toybox Maths</title>
    <meta name="description" content="Short, play-based early maths activities using the toys already in the house." />
    <meta name="theme-color" content="#f1f0f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14122a" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Toybox" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preload" href="./fonts/fredoka.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Apply the chosen light/dark look before anything is drawn, so the page does not flash.
      try {
        var t = JSON.parse(localStorage.getItem('toybox-maths-v2') || '{}').settings;
        if (t && t.theme && t.theme !== 'system') document.documentElement.dataset.theme = t.theme;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <main id="view"></main>

    <div id="sheet"></div>

    <nav class="tabs" aria-label="Main">
      <a href="#/" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" /><circle cx="8.5" cy="8.5" r="1" fill="currentColor" /><circle cx="15.5" cy="15.5" r="1" fill="currentColor" /><circle cx="12" cy="12" r="1" fill="currentColor" /></svg>
        Play
      </a>
      <a href="#/progress" data-tab="progress">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z" /></svg>
        Progress
      </a>
      <a href="#/guide" data-tab="guide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6c-2-1.6-5-2-8-1.5v13c3-.5 6-.1 8 1.5 2-1.6 5-2 8-1.5v-13c-3-.5-6-.1-8 1.5ZM12 6v13" /></svg>
        Guide
      </a>
      <a href="#/settings" data-tab="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 12h3M11 12h9M4 17h12M20 17h0" /><circle cx="16" cy="7" r="2" /><circle cx="9" cy="12" r="2" /><circle cx="18" cy="17" r="2" /></svg>
        Settings
      </a>
    </nav>

    <noscript><p style="padding: 24px">Toybox Maths needs JavaScript switched on.</p></noscript>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
